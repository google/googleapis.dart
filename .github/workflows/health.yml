name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@1d2b5ff862c6b93cd86dd06eadac4c9f4d5d6c20 # main
    with:
      sdk: stable
      # Drop coverage
      checks: "changelog,license,breaking,do-not-submit,leaking,unused-dependencies,publish"
      fail_on: "changelog,do-not-submit,publish"
      warn_on: "license,breaking,leaking,unused-dependencies"
      license: |
        // Copyright %YEAR% Google LLC
        //
        // Use of this source code is governed by a BSD-style
        // license that can be found in the LICENSE file or at
        // https://developers.google.com/open-source/licenses/bsd
      license_test_string: "Google LLC"
      # GENERATED FILES
      ignore_license: 'generated/**,_test_package/**'
      # TOO BIG!
      ignore_changelog: 'generated/**'
      # TOO BIG!
      ignore_unuseddependencies: 'generated/**'
    permissions:
      pull-requests: write
