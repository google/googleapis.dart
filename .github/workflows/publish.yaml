# A CI configuration to auto-publish pub packages.

name: Publish

on:
  pull_request:
    branches: [ master ]
  push:
    tags: [ '[A-z]+-v[0-9]+.[0-9]+.[0-9]+*' ]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.repository_owner == 'google' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@622ef61a7edd5de7df38661e163e55c57606c96a
    permissions:
      id-token: write # Required for authentication using OIDC
      pull-requests: write # Required for writing the pull request note

  stage-exit-gate:
    if: ${{ github.repository_owner == 'google' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Clean up stale releases from staging repo
        run: |
          # clean up stale releases from staging repo
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="googleapis-dart--pubdev" \
              --format="value(name)" 2>/dev/null)

          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="\'"oss-exit-gate-prod"\'" \
                  --location="\'"us"\'" \
                  --repository="\'googleapis-dart--pubdev\'" \
                  --quiet
          '

      - name: Stage package archive and trigger OSS Exit Gate release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_NAME="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"
          if [ -d "generated/${PKG_NAME}" ]; then
            PKG_DIR="generated/${PKG_NAME}"
          elif [ -d "${PKG_NAME}" ]; then
            PKG_DIR="${PKG_NAME}"
          else
            echo "Package directory for ${PKG_NAME} not found"
            exit 1
          fi
          ARCHIVE="${PKG_NAME}-${VERSION}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${PKG_DIR}" .
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=googleapis-dart--pubdev \
            --package="${PKG_NAME}" \
            --version="${VERSION}" \
            --source="${ARCHIVE}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "${PKG_NAME}",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/googleapis-dart/pubdev/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
